# Vedoras — production Nginx config for vedoras.com (Hostinger VPS, same-origin).
#
# Apply on the VPS as the site's vhost, e.g.:
#   sudo cp deploy/nginx-vedoras.conf /etc/nginx/sites-available/vedoras
#   sudo ln -sf /etc/nginx/sites-available/vedoras /etc/nginx/sites-enabled/vedoras
#   sudo rm /etc/nginx/sites-enabled/default   # optional; the default vhost is what
#                                              # 403s unknown hosts like www before this
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumptions:
#   - Frontend build is extracted to /var/www/vedoras (the Vite dist output).
#   - The Node API runs on 127.0.0.1:5000 (pm2/systemd) with
#     UPLOAD_DIR=/var/www/vedoras/uploads and TRUST_PROXY=true.
#   - TLS certificates exist for both vedoras.com and www.vedoras.com
#     (Hostinger hPanel or certbot). The absolute paths below are the
#     certbot defaults — adjust to what the panel generates.
#
# For hPanel: if TLS is managed by the panel, the SSL certificate files are
# generated under /home/<user>/conf/web/vedoras.com and referenced in the
# panel-generated config — in that case keep the panel's ssl block and only
# replace/merge in the location blocks from this file.

server {
    listen 80;
    server_name vedoras.com www.vedoras.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vedoras.com www.vedoras.com;

    # --- TLS (certbot defaults; replace with hPanel-generated paths if used) ---
    ssl_certificate     /etc/letsencrypt/live/vedoras.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedoras.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/vedoras;
    index index.html;

    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API (same origin as the SPA).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded images (proxied so the app owns the directory layout).
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Socket.io (WebSocket upgrades).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — deep links like /admin and /listings/:id must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
